name: Generate contribution snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/contribution-snake.yml

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    name: Refresh contribution grid
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution snake SVGs
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23007AFF&color_dots=%23FFFFFF,%23001F3F,%23007AFF,%23007AFF,%23000000
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23007AFF&color_dots=%23000000,%23001F3F,%23007AFF,%23007AFF,%23FFFFFF

      - name: Enforce locked profile palette
        run: |
          perl -0pi -e 's/\x23\x31\x62\x31\x66\x32\x33\x30\x61/#00000000/g; s/purple/#007AFF/g' dist/*.svg

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          commit_message: Update contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
